name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Build and start the FULL stack in Docker:
      # postgres + rabbitmq + 3 .NET APIs + scs-web + host.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz \
               && curl -sf http://localhost:8081/healthz \
               && curl -sf http://localhost:8082/healthz \
               && curl -sf http://localhost:8083/healthz \
               && curl -sf http://localhost:5174/healthz; then
              echo "all services healthy"; exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      # .NET Playwright: build first (copies the driver install script),
      # then install Chromium + system dependencies.
      - name: Build e2e project
        run: dotnet build e2e/SportianArch.E2E.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh ./e2e/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run e2e tests
        run: dotnet test e2e/SportianArch.E2E.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color
